services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    image: file-manager-app-img  # Built once and used for replicas
    deploy:
      replicas: 1
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - filedata:/file-manager
    env_file:
      - .env
    command: "php-fpm"
    networks:
      - fm-network
    depends_on:
      - redis-fm
      - db-fm

  webserver-fm:
    image: nginx:alpine
    container_name: webserver-fm
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - filedata:/file-manager
    networks:
      - fm-network
    depends_on:
      - app

  db-fm:
    image: mysql:8.0
    container_name: db-fm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - fm-network

  redis-fm:
    image: redis:alpine
    container_name: redis-fm
    restart: unless-stopped
    networks:
      - fm-network
  
  horizon-fm:
    image: file-manager-app-img
    container_name: horizon-fm
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - filedata:/file-manager
    command: php artisan horizon
    networks:
      - fm-network
    depends_on:
      - app
      - redis-fm
      - db-fm

  websocket-fm:
    build:
      context: ./websocket
    container_name: websocket-fm
    working_dir: /usr/src/app
    volumes:
      - ./websocket:/usr/src/app
    environment:
      - WS_PORT=3001
    networks:
      - fm-network

volumes:
  dbdata:
  filedata:

networks:
  fm-network:
    driver: bridge